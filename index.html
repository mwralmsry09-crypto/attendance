<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حَاضِر الذكي - نظام تسجيل الحضور والغياب الذكي</title>
    <!-- استدعاء مكتبة توليد الـ QR كود من رابط مباشر CDN لضمان عملها على السيرفر -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1, h2, h3 { text-align: center; color: var(--primary); }
        .section {
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #fff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #15803d; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #b91c1c; }
        #qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
        }
        #qrcode { margin: 15px 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
        }
        th { background-color: #f1f5f9; }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        .badge-active { background-color: var(--success); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 نظام حَاضِر الذكي</h1>
    <p style="text-align:center; color:#64748b;">إدارة وتسجيل الحضور بالتحقق الجغرافي الذكي</p>

    <!-- واجهة المحاضر / الأدمن -->
    <div id="admin-panel" class="section">
        <h2>🔒 لوحة تحكم المحاضر</h2>
        
        <div class="form-group">
            <label>اسم المحاضرة / المادة *</label>
            <input type="text" id="lecture-name" placeholder="مثال: هندسة البرمجيات">
        </div>
        
        <div class="form-group">
            <label>اسم/رقم القاعة أو المدرج</label>
            <input type="text" id="room-name" placeholder="مثال: مدرج أ">
        </div>

        <div class="form-group">
            <label>النطاق الجغرافي المسموح به (GPS Radius)</label>
            <select id="gps-radius">
                <option value="10">10 أمتار (قاعة صغيرة)</option>
                <option value="30" selected>30 متراً (مدرج متوسط)</option>
                <option value="50">50 متراً (مدرج كبير)</option>
                <option value="100">100 متر (مبنى الكلية)</option>
            </select>
        </div>

        <div class="form-group">
            <label>موقع القاعة الحالي (إحداثيات اللابتوب)</label>
            <button type="button" onclick="getLocation()" class="btn-success" style="margin-bottom:10px;">📍 التقاط إحداثيات موقعي الآن</button>
            <p id="location-status" style="text-align:center; font-size:14px; color:#64748b;">لم يتم تحديد الموقع بعد.</p>
        </div>

        <button onclick="startSession()">🚀 بدء جلسة الحضور وتوليد الـ QR Code</button>

        <!-- منطقة عرض الـ QR بعد البدء -->
        <div id="qr-container" class="hidden">
            <h3>اضغط لتكبير الـ QR واطلب من الطلاب مسحه</h3>
            <div id="qrcode"></div>
            <p id="session-info-display" style="font-weight:bold; color:var(--primary);"></p>
            <button onclick="endSession()" class="btn-danger">🛑 إنهاء الجلسة وتصدير ملف التقرير</button>
        </div>
    </div>

    <!-- واجهة الطالب (تظهر تلقائياً عند مسح الـ QR بالموبايل) -->
    <div id="student-panel" class="section hidden">
        <h2>📝 تسجيل حضور طالب</h2>
        <div id="student-session-details" style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center;"></div>
        
        <div class="form-group">
            <label>الاسم الثلاثي أو الرباعي *</label>
            <input type="text" id="student-name" placeholder="أدخل اسمك كاملاً">
        </div>

        <div class="form-group">
            <label>الرقم / الكود الجامعي *</label>
            <input type="text" id="student-code" placeholder="أدخل كودك الجامعي">
        </div>

        <button onclick="submitAttendance()" class="btn-success">✅ تأكيد وتسجيل الحضور الجغرافي الفوري</button>
        <p id="student-status" style="text-align:center; font-weight:bold; margin-top:15px;"></p>
    </div>

    <!-- سجل الحضور اللحظي للمحاضر -->
    <div id="live-feed-section" class="section">
        <h3>📊 سجل الحضور اللحظي (Real-Time Feed)</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>الكود الجامعي</th>
                    <th>وقت التسجيل</th>
                    <th>حالة النطاق</th>
                </tr>
            </thead>
            <tbody id="attendance-table-body">
                <tr id="no-students"><td colspan="4">لم يسجل أي طالب حضوره بعد في هذه الجلسة</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let adminLat = null;
let adminLng = null;
let qrcodeInstance = null;
let attendanceList = [];

// 1. التقاط إحداثيات موقع المحاضر
function getLocation() {
    const status = document.getElementById('location-status');
    if (!navigator.geolocation) {
        status.innerText = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
        return;
    }
    status.innerText = "جاري التقاط الإحداثيات...";
    navigator.geolocation.getCurrentPosition(
        (position) => {
            adminLat = position.coords.latitude;
            adminLng = position.coords.longitude;
            status.innerHTML = `✅ تم التقاط الموقع بنجاح! <br> (Lat: ${adminLat.toFixed(5)}, Lng: ${adminLng.toFixed(5)})`;
        },
        (error) => {
            status.innerText = "❌ فشل التقاط الموقع. تأكد من تفعيل الـ GPS وإعطاء صلاحية للموقع.";
        }
    );
}

// 2. بدء الجلسة وتوليد الـ QR المطور الحامل للبيانات
function startSession() {
    const lecture = document.getElementById('lecture-name').value;
    const room = document.getElementById('room-name').value;
    const radius = document.getElementById('gps-radius').value;

    if (!lecture || !adminLat || !adminLng) {
        alert("تنبيه: يرجى كتابة اسم المادة والتقاط موقع القاعة أولاً!");
        return;
    }

    // بناء الرابط البرمجي وتشفير البيانات جواه عشان الموبايل يقرأها فوراً دون قاعدة بيانات
    const baseUrl = window.location.origin + window.location.pathname;
    const sessionParams = `?action=attend&sub=${encodeURIComponent(lecture)}&rm=${encodeURIComponent(room)}&rad=${radius}&lat=${adminLat}&lng=${adminLng}`;
    const fullAttendanceUrl = baseUrl + sessionParams;

    // إظهار كونتينر الـ QR
    document.getElementById('qr-container').classList.remove('hidden');
    document.getElementById('session-info-display').innerText = `جلسة جارية لـ: ${lecture} (${room})`;

    // توليد الـ QR كود داخل الـ Div
    document.getElementById('qrcode').innerHTML = "";
    qrcodeInstance = new QRCode(document.getElementById("qrcode"), {
        text: fullAttendanceUrl,
        width: 200,
        height: 200
    });
}

// 3. التحقق مما إذا كان السايت مفتوحاً من رابط الـ QR على موبايل الطالب
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('action') === 'attend') {
        // إخفاء لوحة الأدمن وإظهار لوحة الطالب فوراً
        document.getElementById('admin-panel').classList.add('hidden');
        document.getElementById('live-feed-section').classList.add('hidden');
        document.getElementById('student-panel').classList.remove('hidden');

        // عرض تفاصيل المحاضرة للطالب
        const sub = urlParams.get('sub');
        const rm = urlParams.get('rm');
        document.getElementById('student-session-details').innerText = `المادة: ${sub} | القاعة: ${rm}`;
    }
}
