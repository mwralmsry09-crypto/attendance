<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الحضور الذكي</title>
    <!-- مكتبة توليد الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #f4f4f9; padding: 20px; direction: rtl; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-warning-state { background: #ff9800 !important; color: #fff !important; cursor: pointer; }
        .btn-success-state { background: #28a745 !important; color: #fff !important; cursor: pointer; }
        .admin-btn { background: #17a2b8; margin-top: 10px; }
        .danger-btn { background: #dc3545; margin-top: 10px; }
        .qr-btn { background: #6f42c1; margin-top: 10px; }
        .admin-link { text-align: center; margin-top: 25px; font-size: 0.85em; }
        .admin-link a { color: #888; text-decoration: none; cursor: pointer; }
        .success { color: green; font-weight: bold; margin-top: 10px; text-align: center; }
        .warning { color: #d39e00; font-weight: bold; margin-top: 10px; text-align: center; }
        .error { color: red; font-weight: bold; margin-top: 10px; text-align: center; }
        .hidden { display: none; }
        .info { color: #555; font-size: 0.9em; margin-top: 5px; text-align: center; }
        #qrcode { display: flex; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align: center;">تسجيل حضور المحاضرة</h2>
    
    <!-- رسالة إتمام التسجيل -->
    <div id="alreadyRegisteredMsg" class="error hidden"></div>

    <!-- نموذج تسجيل الطالب (يظهر للجميع) -->
    <form id="attendanceForm">
        <input type="text" id="fullName" placeholder="الاسم بالكامل" required>
        <input type="text" id="studentId" placeholder="كود الطالب / الرقم الجامعي" required>
        <button type="button" id="submitBtn" class="btn-warning-state" onclick="handleButtonClick()">⚠️ اضغط هنا للسماح بالموقع والتسجيل</button>
        <div id="locationStatus" class="info">📍 يرجى الضغط على الزر بالأعلى وإعطاء إذن الموقع الجغرافي</div>
    </form>
    
    <div id="msg"></div>

    <!-- لوحة التحكم الخاصة بالمحاضر (مخفية تماماً عن الطلاب) -->
    <div id="adminPanel" class="hidden">
        <hr style="margin-top: 25px;">
        <h3 style="text-align: center; color: #333;">لوحة المحاضر / الأدمن</h3>
        <button class="qr-btn" type="button" onclick="generateDynamicQR()">📌 تحديد الموقع الحالي وتوليد الـ QR</button>
        <div id="qrcode"></div>
        <button class="admin-btn" type="button" onclick="exportToCSV()">💾 تصدير كشف الحضور (Excel)</button>
        <button class="danger-btn" type="button" onclick="resetAttendanceData()">🗑️ تصفير بيانات الحضور للمحاضرة</button>
    </div>

    <!-- رابط دخول الأدمن السري للأسفل -->
    <div class="admin-link">
        <a id="adminLoginBtn" onclick="loginAdmin()">⚙️ دخول المحاضر</a>
    </div>
</div>

<script>
    // =========================================================================
    // 🔴 إعدادات النظام
    // =========================================================================
    
    const GOOGLE_SCRIPT_URL = "ضع_رابط_GOOGLE_SCRIPT_هنا"; // سيتم ربطه لاحقاً
    const ADMIN_PASSWORD = "1234";                         // كلمة سر المحاضر
    const ALLOWED_DISTANCE_METERS = 50;                     // المسافة المسموحة داخل المدرج (متر)
    let CURRENT_LECTURE_ID = "lecture_01";                   // كود المحاضرة الحالي

    // =========================================================================

    const SUBMITTED_KEY = 'hasSubmitted_' + CURRENT_LECTURE_ID;
    const RECORDS_KEY = 'attendanceRecords_' + CURRENT_LECTURE_ID;

    const urlParams = new URLSearchParams(window.location.search);
    const targetLat = parseFloat(urlParams.get('lat'));
    const targetLng = parseFloat(urlParams.get('lng'));

    let isWithinRange = false;
    let locationGranted = false;

    window.onload = function() {
        if (localStorage.getItem(SUBMITTED_KEY) === 'true') {
            disableForm("⚠️ تم تسجيل استجابتك لهذه المحاضرة بالفعل!");
            return;
        }
        
        if (targetLat && targetLng) {
            requestLocationPermission();
        } else {
            document.getElementById('locationStatus').innerText = "ℹ️ افتح الرابط من خلال مسح الـ QR الخاص بالمحاضر.";
        }
    };

    // تسجيل دخول الأدمن لعرض اللوحة والميزات المخفية
    function loginAdmin() {
        const pass = prompt("أدخل كلمة سر المحاضر:");
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('adminLoginBtn').style.display = 'none';
            alert("تم تسجيل الدخول كأدمن بنجاح!");
        } else if (pass !== null) {
            alert("كلمة السر غير صحيحة!");
        }
    }

    function disableForm(msg) {
        document.getElementById('attendanceForm').classList.add('hidden');
        const msgDiv = document.getElementById('alreadyRegisteredMsg');
        msgDiv.innerText = msg;
        msgDiv.classList.remove('hidden');
    }

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;
    }

    function requestLocationPermission() {
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('locationStatus');

        if (!navigator.geolocation) {
            status.innerHTML = `<span style="color:red;">❌ المتصفح لا يدعم خدمة الموقع الجغرافي.</span>`;
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const studentLat = position.coords.latitude;
                const studentLng = position.coords.longitude;

                const calculatedDistance = getDistanceInMeters(studentLat, studentLng, targetLat, targetLng);
                isWithinRange = calculatedDistance <= ALLOWED_DISTANCE_METERS;
                locationGranted = true;

                btn.className = "btn-success-state";
                btn.innerText = "ارسال طلب التسجيل";

                if (isWithinRange) {
                    status.innerHTML = `<span style="color:green;">✅ تم التحقق من الموقع (داخل نطاق المدرج).</span>`;
                } else {
                    status.innerHTML = `<span style="color:red;">❌ أنت خارج نطاق المدرج! لن تتمكن من التسجيل.</span>`;
                }
            },
            (error) => {
                locationGranted = false;
                btn.className = "btn-warning-state";
                btn.innerText = "⚠️️ اضغط هنا للسماح بالموقع والتسجيل";
                status.innerHTML = `<span style="color:red;">🔒 لم يتم إعطاء إذن الموقع! اضغط على الزر بالأعلى وسامح للمتصفح بالوصول لموقعك.</span>`;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function handleButtonClick() {
        const nameInput = document.getElementById('fullName');
        const idInput = document.getElementById('studentId');

        if (!locationGranted) {
            requestLocationPermission();
            return;
        }

        if (!isWithinRange) {
            alert("عذراً! أنت خارج نطاق المدرج المسموح ولا يمكنك التسجيل.");
            return;
        }

        if (!nameInput.value.trim() || !idInput.value.trim()) {
            alert("يرجى إدخال الاسم وكود الطالب أولاً!");
            return;
        }

        saveAttendance(nameInput.value.trim(), idInput.value.trim());
    }

    function saveAttendance(name, id) {
        const time = new Date().toLocaleTimeString('ar-EG');
        const msgDiv = document.getElementById('msg');
        
        let records = JSON.parse(localStorage.getItem(RECORDS_KEY)) || [];

        const duplicateId = records.some(r => r.id === id);
        if (duplicateId) {
            msgDiv.className = "error";
            msgDiv.innerText = "عذراً! هذا الرقم الجامعي مسجل بالفعل.";
            return;
        }

        records.push({ name, id, time, valid: isWithinRange });

        localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
        localStorage.setItem(SUBMITTED_KEY, 'true');
        
        msgDiv.className = "success";
        msgDiv.innerText = "تم تسجيل حضورك بنجاح!";
        
        setTimeout(() => {
            disableForm("⚠️ تم تسجيل استجابتك لهذه المحاضرة بالفعل!");
        }, 1500);
    }

    // توليد الـ QR Code
    function generateDynamicQR() {
        if (!navigator.geolocation) {
            alert("خدمة تحديد الموقع غير مفعلة على جهازك!");
            return;
        }

        alert("جاري تحديد موقع المدرج وتوليد الـ QR...");

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                const baseUrl = window.location.href.split('?')[0];
                const qrUrl = `${baseUrl}?lat=${lat}&lng=${lng}`;

                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                
                new QRCode(qrContainer, {
                    text: qrUrl,
                    width: 200,
                    height: 200
                });

                alert("تم توليد الـ QR بنجاح لموقع المدرج الحالي!");
            },
            (error) => {
                alert("تعذر تحديد موقعك الحالي، تأكد من إعطاء إذن الموقع للمتصفح!");
            },
            { enableHighAccuracy: true }
        );
    }

    // تصدير ملف Excel محلي
    function exportToCSV() {
        let records = JSON.parse(localStorage.getItem(RECORDS_KEY)) || [];
        if (records.length === 0) {
            alert("لا توجد بيانات مسجلة لهذه المحاضرة بعد!");
            return;
        }

        let csvContent = "\uFEFF=== كشف الحضور (داخل المدرج) ===\nالاسم,كود الطالب,وقت التسجيل\n";
        records.forEach(r => {
            csvContent += `"${r.name.replace(/,/g, ' ')}","\t${r.id.replace(/,/g, ' ')}","${r.time}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `حضور_${CURRENT_LECTURE_ID}.csv`;
        a.click();
    }

    // تصفير بيانات المحاضرة
    function resetAttendanceData() {
        if (confirm("هل أنت تأكد من رغبتك في مسح كافة تسجيلات المحاضرة الحالية؟")) {
            localStorage.removeItem(RECORDS_KEY);
            localStorage.removeItem(SUBMITTED_KEY);
            alert("تم تصفير البيانات بنجاح! يمكنك الآن بدء تسجيل محاضرة جديدة.");
            location.reload();
        }
    }
</script>
</body>
</html>
